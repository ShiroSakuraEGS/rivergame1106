<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>《瓦磘溝探索之旅》消失的河川記憶｜兒童互動式河川教育遊戲</title>
    <meta name="description" content="一場關於河流、居民、動物與守護的冒險。專為國小三至六年級設計的瓦磘溝沉浸式河川教育互動遊戲。">

    <!-- PWA 與主題色彩 -->
    <meta name="theme-color" content="#00897b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">

    <!-- Open Graph 社群分享卡片 (支援 LINE / Facebook / Twitter 縮圖預覽) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="《瓦磘溝探索之旅》消失的河川記憶">
    <meta property="og:description" content="國小學童在地河川互動式教育遊戲：歷史水路探索、動植物生態觀察、解開醜泥怪的污染真相，找回三枚河川記憶碎片！">
    <meta property="og:image" content="assets/images/cover.png">

    <!-- Google Fonts 預連接（Fredoka + Nunito — Playful Creative 配對，UI/UX Pro Max 推薦） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap">

    <!-- 引入樣式表 -->
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
</head>

<body>
    <div id="game-app">
        <!-- ==========================================
             一、開始封面螢幕（Start Screen）
             底圖直接展示《瓦磘溝探索之旅 (1).png》，畫面上僅保留關鍵按鈕
             ========================================== -->
        <section id="start-screen" class="start-screen" aria-label="遊戲首頁封面">
            <!-- 全屏插畫底圖 -->
            <div class="cover-bg-image" role="img" aria-label="瓦磘溝探索之旅主視覺插畫"></div>
            <!-- 柔和環境漸層遮罩（僅增強底部按鈕對比，不遮蔽原畫） -->
            <div class="cover-overlay"></div>

            <!-- 無障礙螢幕閱讀器友善標題（視覺隱藏） -->
            <h1 class="sr-only">瓦磘溝探索之旅：消失的河川記憶</h1>

            <!-- 頂部快速工具列（右上角極簡懸浮圖示列：章節、導讀、音樂） -->
            <header class="cover-top-bar">
                <div class="cover-top-actions">
                    <button id="btn-start-chapters" class="btn-cover-icon" aria-label="章節選擇" title="章節選擇">🗺️</button>
                    <button id="btn-guide" class="btn-cover-icon" aria-label="故事背景與導讀手冊" title="故事背景與導讀手冊">📖</button>
                    <button id="btn-start-mute" class="btn-cover-icon" title="音樂播放中（點擊關閉）" aria-label="切換音樂">🎵</button>
                </div>
            </header>

            <!-- 底部核心操作：極致簡約純粹「開始探索」按鈕，不遮蔽原畫主體 -->
            <div class="cover-bottom-bar fade-in" aria-label="開始探索">
                <button id="btn-start-game" class="btn-primary btn-start-hero-pure" aria-label="開始探索旅程">
                    <span class="btn-icon">🌊</span>
                    <span class="btn-text">開始探索</span>
                </button>
            </div>
        </section>

        <!-- ==========================================
             二、主遊戲操作螢幕（Game Screen）
             ========================================== -->
        <main id="game-screen" class="game-screen hidden">
            <!-- 頂部 HUD 狀態列 -->
            <header class="game-hud">
                <div class="hud-left">
                    <span id="hud-chapter-badge" class="hud-badge">序章</span>
                    <span id="hud-chapter-title" class="hud-title">神祕的河川呼喚</span>
                    <span id="hud-mission-desc" class="hud-mission">找到小水滴，展開河川探索</span>
                </div>

                <div class="hud-center">
                    <div class="fragments-inventory">
                        <span class="inventory-label">記憶之流：</span>
                        <div class="fragment-slots">
                            <div id="slot-history_stone" class="fragment-slot" title="歷史之石">🪨</div>
                            <div id="slot-ecology_leaf" class="fragment-slot" title="生態之葉">🍃</div>
                            <div id="slot-protection_water" class="fragment-slot" title="守護之水">💧</div>
                        </div>
                    </div>
                </div>

                <div class="hud-right">
                    <button id="btn-chapters" class="btn-hud-tool" title="章節導覽">🗺️ 章節</button>
                    <button id="btn-mute" class="btn-hud-tool" title="切換音樂">🎵 音樂</button>
                    <button id="btn-restart" class="btn-hud-tool" title="重新開始">🔄 重設</button>
                </div>
            </header>

            <!-- 舞台場景展示與立繪演出區 -->
            <section class="game-stage">
                <div id="stage-background" class="stage-background bg-ch0"></div>
                <div id="stage-characters" class="stage-characters">
                    <!-- 角色立繪由遊戲引擎動態掛載 -->
                </div>
            </section>

            <!-- 下半部互動區與對話框 -->
            <footer class="game-console">
                <!-- 互動任務操作面板（選擇題、尋寶、卡片配對、承諾卡等） -->
                <div id="interaction-area" class="interaction-area hidden"></div>

                <!-- 故事對話框 -->
                <div id="dialogue-box" class="dialogue-box">
                    <div id="speaker-avatar" class="dialogue-speaker-avatar">
                        <!-- 說話角色頭像由引擎渲染 -->
                    </div>
                    <div class="dialogue-body">
                        <div class="speaker-meta">
                            <span id="speaker-name" class="speaker-name">小水滴</span>
                            <span id="speaker-title" class="speaker-title">瓦磘溝記憶之流</span>
                            <span id="speaker-catchphrase" class="speaker-catchphrase"></span>
                        </div>
                        <div id="dialogue-text" class="dialogue-text">
                            正在載入瓦磘溝探索之旅……
                        </div>
                    </div>
                    <div class="dialogue-advance-hint">
                        <button id="btn-next-dialogue" class="btn-next-dialogue" title="繼續下一句">▼</button>
                    </div>
                </div>
            </footer>
        </main>

        <!-- ==========================================
             三、全域彈跳視窗（Modal Overlay）
             ========================================== -->
        <div id="modal-overlay" class="modal-overlay hidden">
            <div class="modal-container">
                <button id="modal-close-btn" class="modal-close-btn" title="關閉視窗">✕</button>
                <div id="modal-content" class="modal-content">
                    <!-- 彈窗內容動態注入 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 載入腳本 -->
    <script src="js/storyData.js"></script>
    <script src="js/audioManager.js"></script>
    <script src="js/gameEngine.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
